[project]
name = "tryhackme-mcp"
version = "0.1.0"
description = "Unofficial MCP server for TryHackMe: rooms, tasks, paths, profiles, progress and lab machines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Armaan Sidhu" }]
keywords = ["mcp", "tryhackme", "cybersecurity", "claude", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Education",
]
dependencies = [
  "mcp[cli]>=2.0,<3",
  "httpx>=0.27",
  "markdownify>=0.13",
]

[project.urls]
Homepage = "https://github.com/realarmaansidhu/tryhackme-mcp"
Issues = "https://github.com/realarmaansidhu/tryhackme-mcp/issues"
Documentation = "https://github.com/realarmaansidhu/tryhackme-mcp/tree/main/docs"
Changelog = "https://github.com/realarmaansidhu/tryhackme-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
tryhackme-mcp = "tryhackme_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tryhackme_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
